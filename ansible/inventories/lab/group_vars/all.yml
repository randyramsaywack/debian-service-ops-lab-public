---
ansible_user: debian
ansible_become: true

lab_admin_user: debian
lab_timezone: America/New_York

baseline_packages:
  - apt-transport-https
  - bash-completion
  - ca-certificates
  - curl
  - git
  - htop
  - qemu-guest-agent
  - sudo
  - vim

baseline_manage_hosts_file: false

ssh_hardening_port: 22
ssh_hardening_permit_root_login: "no"
ssh_hardening_password_authentication: "no"
ssh_hardening_pubkey_authentication: "yes"
ssh_hardening_x11_forwarding: "no"
ssh_hardening_use_dns: "no"

lab_admin_group: sudo
lab_admin_sudo_nopasswd: true

firewall_enabled: true
firewall_allowed_tcp_ports:
  - 22
