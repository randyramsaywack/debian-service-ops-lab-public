---
- name: Deploy nginx smoke service
  hosts: debian_lab
  become: true
  gather_facts: true

  pre_tasks:
    - name: Assert supported operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Debian"
          - ansible_distribution_major_version | int == 12
        fail_msg: "This nginx smoke service currently targets Debian 12 only."

  roles:
    - nginx_demo
