---
- name: Ensure nginx is installed
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Ensure nginx document root exists
  ansible.builtin.file:
    path: "{{ nginx_demo_document_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install nginx smoke page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_demo_document_root }}/index.html"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Install frontend application script
  ansible.builtin.template:
    src: app.js.j2
    dest: "{{ nginx_demo_document_root }}/app.js"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Install nginx site configuration
  ansible.builtin.template:
    src: ops-lab.conf.j2
    dest: /etc/nginx/sites-available/ops-lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx site configuration
  ansible.builtin.file:
    src: /etc/nginx/sites-available/ops-lab.conf
    dest: /etc/nginx/sites-enabled/ops-lab.conf
    state: link
  notify: Reload nginx

- name: Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Validate nginx configuration
  ansible.builtin.command: /usr/sbin/nginx -t
  changed_when: false

- name: Ensure nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Flush nginx handlers
  ansible.builtin.meta: flush_handlers
