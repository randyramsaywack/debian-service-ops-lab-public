---
- name: Ensure OpenSSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Install managed sshd hardening drop-in
  ansible.builtin.template:
    src: 99-lab-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-lab-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Ensure ssh service is enabled and running
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started
